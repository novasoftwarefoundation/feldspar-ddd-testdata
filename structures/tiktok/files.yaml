# Layout of tiktok packages, combined over every package added with `ddd.py add`.
# Written by ddd.py; only `expected`, `wording` and `notes` are edited by hand:
#   expected: file names the platform's donation scripts read (alternatives separated by " | ")
#   wording: the platform's own words and labels, kept in names, keys and labels even where they also occur as
#     values or are long
#   personal_keys: patterns (regular expressions) of keys that hold user data, written as <name>
expected:
  - "user_data_tiktok.json | user_data.json"
files:
  "user_data.json":
    ascii: false
    first_seen: "2024-12-10"
    indent: 2
    kind: "json"
    langs:
      - "en"
    last_seen: "2024-12-10"
    meta_encoding: false
    schema: "schemas/user_data.schema.json"
    seen_in: 1
  "user_data_tiktok.json":
    ascii: true
    first_seen: "2024-09-02"
    indent: 2
    kind: "json"
    langs:
      - "en"
    last_seen: "2024-09-02"
    meta_encoding: false
    not_seen_since: "2024-09-02"
    schema: "schemas/user_data_tiktok.schema.json"
    seen_in: 1
last_change:
  date: "2024-12-10"
  summary: "package of 2024-12-10 (en) added: 1 new, 0 changed shape, 1 not seen since an earlier package"
left_out:
  "key part replaced by <value>: user_data.json $.Direct Messages.Chat History.ChatHistory": 3
  "key that is user data replaced by <name>: user_data.json $.App Settings.Settings.SettingsMap.Family Content Preferences": 1
notes:
  - "expected: the file names that the D3i data-donation-task scripts (platforms/tiktok.py) read."
  - "personal_keys: TikTok writes its own keys in Title Case or CamelCase; a lower-case key with letters and a dot, underscore or digit is a username (as under Family Content Preferences)."
packages:
  - date: "2024-09-02"
    lang: "en"
  - date: "2024-12-10"
    lang: "en"
personal_keys:
  - "(?=.*[a-z])(?=.*[._0-9])[a-z0-9._]+"
platform: "tiktok"
wording: []
